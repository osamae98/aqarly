# pnpm 10 reads install settings from here rather than package.json.
# No dependency may run install scripts. unrs-resolver (pulled in by
# eslint-config-next) ships prebuilt platform binaries, so skipping its
# postinstall is safe — listing it here just acknowledges that.
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - unrs-resolver
